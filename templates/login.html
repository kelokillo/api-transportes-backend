<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 350px;
            text-align: center;
        }
        h2 {
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #34495e;
            font-size: 14px;
            font-weight: 500;
        }
        /* Estilos para los inputs generados por Django */
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box; /* Asegura que el padding no desborde el input */
            font-size: 14px;
        }
        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }
        .error-message {
            color: #e74c3c;
            font-size: 14px;
            margin-bottom: 20px;
            background-color: #fce4e4;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #fccac6;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s ease;
            margin-top: 10px;
        }
        button:hover {
            background-color: #2980b9;
        }
        .back-link {
            display: block;
            margin-top: 25px;
            color: #7f8c8d;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover {
            color: #34495e;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Ingreso al Sistema</h2>

        <!-- Mensaje de error si el usuario se equivoca -->
        {% if form.errors %}
            <div class="error-message">
                Nombre de usuario o contraseña incorrectos. Por favor, inténtalo de nuevo.
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="id_username">Usuario:</label>
                {{ form.username }}
            </div>
            
            <div class="form-group">
                <label for="id_password">Contraseña:</label>
                {{ form.password }}
            </div>

            <button type="submit">Iniciar Sesión</button>
            
            <!-- Campo oculto para que la redirección (?next=) funcione -->
            <input type="hidden" name="next" value="{{ next }}">
        </form>

        <a href="{% url 'bienvenida' %}" class="back-link">← Volver al inicio</a>
    </div>

</body>
</html>
