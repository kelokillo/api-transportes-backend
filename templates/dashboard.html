<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Privado</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .panel-card {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 600px;
            margin: 0 auto;
            border-top: 5px solid #2ecc71;
        }
        h1 {
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .mensaje-seguridad {
            background-color: #e8f8f5;
            color: #27ae60;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #d5f5e3;
            margin-bottom: 30px;
            font-size: 16px;
        }
        button {
            background-color: #34495e;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #2c3e50;
        }
    </style>
</head>
<body>

    <div class="panel-card">
        <h1>Panel Privado del Sistema</h1>
        
        <div class="mensaje-seguridad">
            <strong>Acceso Autorizado:</strong> Esta vista está protegida y solo es visible para usuarios autenticados.
        </div>

        <p style="font-size: 18px; margin-bottom: 30px;">
            ¡Bienvenido, <strong style="color: #3498db; text-transform: uppercase;">{{ user.username }}</strong>!
        </p>

        <a href="{% url 'bienvenida' %}"><button>← Volver al Inicio</button></a>
    </div>

</body>
</html>
